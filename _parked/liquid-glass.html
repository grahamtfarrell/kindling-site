<!-- 1. CSS: inside the main <style>, just before "/* v.1 / v.2 switch for client review */" -->
<style>
/* v.2: liquid-glass band along the bottom of the window. The page refracts through it;
   Chromium gets the real displacement, other browsers a soft blur. */
.liquid{display:none}
.v2 .liquid{display:block;position:fixed;left:-24px;right:-24px;bottom:-24px;height:calc(15vh + 24px);z-index:60;pointer-events:none;
  -webkit-backdrop-filter:blur(1.5px) saturate(1.1);backdrop-filter:blur(1.5px) saturate(1.1);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 75%);mask-image:linear-gradient(to bottom,transparent 0,#000 75%)}
.v2.warp .liquid{-webkit-backdrop-filter:url(#liquid);backdrop-filter:url(#liquid)}
@media (max-width:900px){.v2 .liquid{height:calc(10vh + 24px)}}

</style>

<!-- 2. HTML: just before <nav class="vtog" ...> -->
<div class="liquid" aria-hidden="true"></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency="0.005 0.016" numOctaves="2" seed="7" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/></filter></svg>

<!-- 3. JS: in the second <script>, just before "/* 0. lay the viewfinder" -->
<script>
  /* v.2 liquid band: refracts more while the page is moving, then settles */
  if(document.documentElement.classList.contains('v2') && window.chrome){
    document.documentElement.classList.add('warp');
    var dm=document.querySelector('#liquid feDisplacementMap'), rest=16, cur=rest, lastY=scrollY, lastT=performance.now(), boost=0, lraf=0;
    function lstep(now){
      lraf=0; var dt=Math.max(16,now-lastT); lastT=now;
      var v=Math.abs(scrollY-lastY)/dt*16; lastY=scrollY;           // px per frame
      boost=Math.max(boost*.9, Math.min(34,v*1.4));
      var target=rest+boost; cur+=(target-cur)*.2;
      dm.setAttribute('scale',cur.toFixed(1));
      if(Math.abs(cur-rest)>.2) lraf=requestAnimationFrame(lstep);
    }
    if(!reduce) addEventListener('scroll',function(){ if(!lraf){ lastT=performance.now(); lraf=requestAnimationFrame(lstep) } },{passive:true});
  }

</script>
